name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Content tests and the release rule guard the published agent; copies
      # made with "Use this template" run the structure check only.
      - name: Agent Standard (release rule on pull requests)
        if: github.event_name == 'pull_request' && github.repository == 'webspenser/sales-partner'
        uses: webspenser/agent-builder/validate@main
        with:
          path: .
          require-bump-against: origin/${{ github.base_ref }}
      - name: Agent Standard
        if: github.event_name != 'pull_request' || github.repository != 'webspenser/sales-partner'
        uses: webspenser/agent-builder/validate@main
        with:
          path: .
      - name: Content tests
        if: github.repository == 'webspenser/sales-partner'
        run: tests/run-all.sh
