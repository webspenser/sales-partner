# Apify guard policy: seven actors and two reads. Each tool takes only the
# arguments listed under only_keys (an allowlist: anything else the
# vendor accepts, such as paid add-ons, proxyConfig or proxyConfiguration,
# locationQuery or startUrls on Maps and reviews, custom headers, cookies,
# page functions, sitemaps or URL globs, is blocked), and each call's size
# is pinned or capped from the pushed bindings/scraping.md. Everything else
# on the server (call-actor, search/add actors, store, tasks, webhooks,
# schedules, aborting runs, key-value stores) is outside allow. Names come
# from the probe notes: Maps and contacts from
# docs/superpowers/notes/2026-10-13-apify-connector-probe.md in
# agent-builder; reviews, ads, jobs and the site reader from this repo's
# docs/superpowers/notes/2026-10-18-research-actors-probe.md. Tool names
# are matched without regard to case (the reviews actor's tool is
# compass--Google-Maps-Reviews-Scraper), and server_match apify covers the
# connector's claude_ai_Apify_Actors server. Three text pins fix the Google
# Ads mode (resultType), the crawler (crawlerType) and the HTML
# transformer (htmlTransformer). Four fixed values (Standard 7.3), each
# required, hold the safety settings that are not operator choices:
# personalData false on reviews, onlyTotal true on Facebook, and
# saveMarkdown true and removeElementsCssSelector on the site reader.
# URL rules check every start URL: Facebook takes https pages on
# facebook.com or www.facebook.com with no query or fragment; the site
# reader and the contact scraper take only an https site root on a public
# host (no path, query, fragment, IP address, local name or odd port).
# The URL rules check only url: only_keys on startUrls[] still blocks
# requestsFromUrl and the other start URL fields. No refuse_args: the
# allowlists already block every argument not named, so a deny list
# would add nothing.
covers: [no_external_send, allowlisted_actors, pinned_inputs]
allow: [compass--crawler-google-places, vdrmota--contact-info-scraper, compass--Google-Maps-Reviews-Scraper,
  scrapesage--google-ads-transparency-scraper, apify--facebook-ads-scraper, valig--indeed-jobs-scraper,
  apify--website-content-crawler, get-actor-run, get-dataset-items]
deny: ["*call-actor*", "*call_actor*", "*search-actors*", "*add-actor*", "*fetch-actor*", "*webhook*", "*schedule*"]
only_keys:
  - tools: [compass--crawler-google-places]
    at: ["$"]
    keys: [searchStringsArray, city, state, countryCode, maxCrawledPlacesPerSearch, language, waitSecs]
  - tools: [vdrmota--contact-info-scraper]
    at: ["$"]
    keys: [startUrls, maxRequestsPerStartUrl, maxDepth, maxRequests, mergeContacts, sameDomain, considerChildFrames, waitSecs]
  # requestsFromUrl, method, payload, headers and userData ride on a start URL object.
  - tools: [vdrmota--contact-info-scraper, apify--facebook-ads-scraper, apify--website-content-crawler]
    at: ["startUrls[]"]
    keys: [url]
  - tools: [compass--Google-Maps-Reviews-Scraper]
    at: ["$"]
    keys: [placeIds, maxReviews, reviewsSort, reviewsStartDate, reviewsFilterString, reviewsOrigin, language, personalData, waitSecs]
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: ["$"]
    keys: [queries, resultType, maxAdvertisersPerQuery, maxAdsPerSearch, region, waitSecs]
  - tools: [apify--facebook-ads-scraper]
    at: ["$"]
    keys: [startUrls, onlyTotal, resultsLimit, activeStatus, onlyAdsNewerThan, waitSecs]
  - tools: [valig--indeed-jobs-scraper]
    at: ["$"]
    keys: [title, location, country, limit, datePosted, waitSecs]
  - tools: [apify--website-content-crawler]
    at: ["$"]
    keys: [startUrls, crawlerType, maxCrawlPages, maxResults, maxCrawlDepth, htmlTransformer, removeElementsCssSelector, saveMarkdown, waitSecs]
  - tools: [get-dataset-items]
    at: ["$"]
    keys: [datasetId, fields, limit, offset, clean, omit, desc]
  - tools: [get-actor-run]
    at: ["$"]
    keys: [runId, waitSecs]
# Exact values, equal in type too (false is not "false"); leaving one out
# is blocked.
fixed:
  - tools: [compass--Google-Maps-Reviews-Scraper]
    at: [personalData]
    value: false
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [onlyTotal]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [saveMarkdown]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [removeElementsCssSelector]
    value: 'script, style, noscript, svg'
    required: true
# Every start URL must name a url that passes these rules (query and
# fragment are forbidden by default).
urls:
  - tools: [apify--facebook-ads-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: [facebook.com, www.facebook.com]
    path: any
    required: true
  - tools: [apify--website-content-crawler, vdrmota--contact-info-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: public
    path: root
    required: true
# One entry per argument, so leaving any one out is blocked ("names no
# pinned value"), even where two arguments share a binding.
recipients:
  - tools: [compass--crawler-google-places]
    at: [maxCrawledPlacesPerSearch]
    bound: max_places_per_search
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequestsPerStartUrl]
    bound: max_pages_per_site
  - tools: [vdrmota--contact-info-scraper]
    at: [maxDepth]
    bound: max_crawl_depth
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequests]
    bound: max_pages_per_call
  - tools: [compass--Google-Maps-Reviews-Scraper]
    at: [maxReviews]
    bound: max_reviews
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdsPerSearch]
    bound: max_ads
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdvertisersPerQuery]
    bound: max_ad_advertisers
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [resultType]
    bound: ads_result_type
  - tools: [apify--facebook-ads-scraper]
    at: [resultsLimit]
    bound: max_ads
  - tools: [valig--indeed-jobs-scraper]
    at: [limit]
    bound: max_jobs
  - tools: [apify--website-content-crawler]
    at: [crawlerType]
    bound: site_crawler_type
  - tools: [apify--website-content-crawler]
    at: [htmlTransformer]
    bound: site_html_transformer
  - tools: [apify--website-content-crawler]
    at: [maxCrawlPages]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxResults]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxCrawlDepth]
    bound: max_site_depth
# List lengths multiply the size pins: one search term per Maps call, at
# most 10 sites per contact call, one place per reviews call, one query
# per Google Ads call, one page URL per Facebook call, one start URL per
# site read, at most 100 items per dataset read. The lists are required,
# so leaving them out cannot skip the cap.
# only_keys names are compared exactly: send the spelling listed above.
limits:
  - tools: [compass--crawler-google-places]
    at: [searchStringsArray]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [vdrmota--contact-info-scraper]
    at: [startUrls]
    bound: max_sites_per_call
    kind: count
    required: true
  - tools: [compass--Google-Maps-Reviews-Scraper]
    at: [placeIds]
    bound: max_review_places
    kind: count
    required: true
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [queries]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [startUrls]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--website-content-crawler]
    at: [startUrls]
    bound: max_site_urls
    kind: count
    required: true
  - tools: [get-dataset-items]
    at: [limit]
    bound: max_dataset_items
    kind: max
