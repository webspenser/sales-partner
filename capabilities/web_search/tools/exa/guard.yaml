# Exa guard policy: Exa's hosted MCP server
# (https://mcp.exa.ai/mcp?tools=web_search_exa) added as a claude.ai
# connector named ExaSearch (server_match exasearch). Only web_search_exa
# runs, and it takes only query and objective (the connector requires
# objective: the goal the search serves, which ranks results but does not
# change their number or cost): numResults (and any respelling) is
# blocked, so Exa's default of 10 results applies. agent_run (Exa's
# research agent), web_search_advanced_exa, web_fetch_exa and every other
# tool on the server are outside allow. Tool names come from Exa's MCP
# server documentation (github.com/exa-labs/exa-mcp-server, toolRegistry)
# and the live probe in
# docs/superpowers/notes/2026-10-31-exa-connector-probe.md. Nothing is
# pinned from bindings: the policy itself fixes the call's size.
covers: [no_external_send, allowlisted_tools, default_result_count]
allow: [web_search_exa]
only_keys:
  - tools: [web_search_exa]
    at: ["$"]
    keys: [query, objective]
