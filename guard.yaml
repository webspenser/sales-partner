# sales-partner agent guard policy: applies to every MCP call inside an
# instance, whatever the server. Nothing this agent does sends a message to
# anyone but the business owner, and to the owner only through owner_notify
# (exempt below; the bound tool pins recipients). It never replies, forwards,
# publishes or schedules a message, or writes calendar events (which email
# invites); talking points go to the CRM, for the operator.
# call_tool: a generic dispatcher (Zernio) would hide any tool behind it.
# *_workflow*: n8n's instance-level tools run or rebuild any workflow, a
# dispatcher that could reach a workflow which sends.
# *-actor*, *_actor*, *webhook*, *--*, *-slash-*, *_slash_*: Apify's
# actor tools in every spelling (call, add, search, fetch details, abort,
# run reads), its webhooks, every owner--actor tool and the older
# apify-slash-<actor> names. The guard matches tool names, not servers.
# Since 9.0.0 the agent scrapes only through the Webspenser server, so an
# Apify connector left attached to a routine has no tool policy of its own.
covers: [no_external_send]
deny: ["*send*", "*reply*", "*forward*", "*publish*", "*schedule_message*",
       "*cross_post*", "*posts_create*", "*bulk_upload_posts*", "*posts_retry*",
       "*execute_write*", "*call_tool*", "*create_event*", "*update_event*",
       "*respond_to_event*", "*_workflow*", "*restore_workflow*",
       "*-actor*", "*_actor*", "*webhook*", "*--*", "*-slash-*", "*_slash_*"]
exempt: [owner_notify]
