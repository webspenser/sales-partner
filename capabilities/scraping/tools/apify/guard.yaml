# Apify guard policy: ten actors and two reads. Each tool takes only the
# arguments listed under only_keys (an allowlist: anything else the
# vendor accepts, such as paid add-ons, proxyConfig or proxyConfiguration,
# locationQuery or startUrls on Maps, place_urls or search on reviews, custom headers, cookies,
# page functions, sitemaps or URL globs, is blocked), and each call's size
# is pinned or capped from the pushed bindings/scraping.md. Everything else
# on the server (call-actor, search/add actors, store, tasks, webhooks,
# schedules, aborting runs, key-value stores) is outside allow. Names come
# from the probe notes: Maps and contacts from
# docs/superpowers/notes/2026-10-13-apify-connector-probe.md in
# agent-builder; reviews, ads, jobs and the site reader from this repo's
# docs/superpowers/notes/2026-10-18-research-actors-probe.md; the LinkedIn
# search and the Instagram and TikTok readers from this repo's
# docs/superpowers/notes/2026-11-03-social-profiles-actors-probe.md. Tool names
# are matched without regard to case (the reviews actor's tool is
# web_wanderer--google-reviews-scraper), and server_match apify covers any
# connector whose server name contains apify (claude_ai_Apify_Actors,
# claude_ai_Apify_Connector, Apify-Actors). The reviews actor replaced
# compass--Google-Maps-Reviews-Scraper in 8.5.1, after that tool moved to
# an HTTP server interface the connector could not call
# (docs/superpowers/notes/2026-11-09-reviews-actor-probe.md). Three text pins fix the Google
# Ads mode (resultType), the crawler (crawlerType) and the HTML
# transformer (htmlTransformer). Eight fixed values (Standard 7.3), each
# required, hold the safety settings that are not operator choices:
# include_personal false on reviews, onlyTotal true on Facebook,
# saveMarkdown true and removeElementsCssSelector on the site reader,
# profileScraperMode "Full" (never the email search mode), strictSearch
# true and maxPages 1 on the LinkedIn search, and resultsPerPage 1 on the
# TikTok reader (its default is 100 videos per profile).
# URL rules check every start URL: Facebook takes https pages on
# facebook.com or www.facebook.com with no query or fragment; the site
# reader and the contact scraper take only an https site root on a public
# host (no path, query, fragment, IP address, local name or odd port).
# The URL rules check only url: only_keys on startUrls[] still blocks
# requestsFromUrl and the other start URL fields. The Instagram and
# TikTok readers take handles, not URLs, so no URL rule applies to them:
# the guard counts the handles but cannot check what they say. Data could
# ride out in a handle, the same class of limit as data riding in a
# hostname on the URL rules. No refuse_args: the
# allowlists already block every argument not named, so a deny list
# would add nothing.
covers: [no_external_send, allowlisted_actors, pinned_inputs]
allow: [compass--crawler-google-places, vdrmota--contact-info-scraper, web_wanderer--google-reviews-scraper,
  scrapesage--google-ads-transparency-scraper, apify--facebook-ads-scraper, valig--indeed-jobs-scraper,
  apify--website-content-crawler, harvestapi--linkedin-profile-search-by-name, apify--instagram-profile-scraper,
  clockworks--tiktok-profile-scraper, get-actor-run, get-dataset-items]
deny: ["*call-actor*", "*call_actor*", "*search-actors*", "*add-actor*", "*fetch-actor*", "*webhook*", "*schedule*"]
only_keys:
  - tools: [compass--crawler-google-places]
    at: ["$"]
    keys: [searchStringsArray, city, state, countryCode, maxCrawledPlacesPerSearch, language, waitSecs]
  - tools: [vdrmota--contact-info-scraper]
    at: ["$"]
    keys: [startUrls, maxRequestsPerStartUrl, maxDepth, maxRequests, mergeContacts, sameDomain, considerChildFrames, waitSecs]
  # requestsFromUrl, method, payload, headers and userData ride on a start URL object.
  - tools: [vdrmota--contact-info-scraper, apify--facebook-ads-scraper, apify--website-content-crawler]
    at: ["startUrls[]"]
    keys: [url]
  - tools: [web_wanderer--google-reviews-scraper]
    at: ["$"]
    keys: [place_ids, limit, order, anyDate, searchKeyword, source, lang, include_personal, waitSecs]
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: ["$"]
    keys: [queries, resultType, maxAdvertisersPerQuery, maxAdsPerSearch, region, waitSecs]
  - tools: [apify--facebook-ads-scraper]
    at: ["$"]
    keys: [startUrls, onlyTotal, resultsLimit, activeStatus, onlyAdsNewerThan, waitSecs]
  - tools: [valig--indeed-jobs-scraper]
    at: ["$"]
    keys: [title, location, country, limit, datePosted, waitSecs]
  - tools: [apify--website-content-crawler]
    at: ["$"]
    keys: [startUrls, crawlerType, maxCrawlPages, maxResults, maxCrawlDepth, htmlTransformer, removeElementsCssSelector, saveMarkdown, waitSecs]
  # Company, school, title and industry filters stay out: the search is
  # by name and city only.
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: ["$"]
    keys: [firstName, lastName, locations, maxItems, maxPages, profileScraperMode, strictSearch, waitSecs]
  - tools: [apify--instagram-profile-scraper]
    at: ["$"]
    keys: [usernames, waitSecs]
  # Comments, followers, downloads, subtitles, filters, sorting, sections
  # and the video store stay out.
  - tools: [clockworks--tiktok-profile-scraper]
    at: ["$"]
    keys: [profiles, resultsPerPage, waitSecs]
  - tools: [get-dataset-items]
    at: ["$"]
    keys: [datasetId, fields, limit, offset, clean, omit, desc]
  - tools: [get-actor-run]
    at: ["$"]
    keys: [runId, waitSecs]
# Exact values, equal in type too (false is not "false"); leaving one out
# is blocked.
fixed:
  - tools: [web_wanderer--google-reviews-scraper]
    at: [include_personal]
    value: false
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [onlyTotal]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [saveMarkdown]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [removeElementsCssSelector]
    value: 'script, style, noscript, svg'
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [profileScraperMode]
    value: 'Full'
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [strictSearch]
    value: true
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [maxPages]
    value: 1
    required: true
  - tools: [clockworks--tiktok-profile-scraper]
    at: [resultsPerPage]
    value: 1
    required: true
# Every start URL must name a url that passes these rules (query and
# fragment are forbidden by default).
urls:
  - tools: [apify--facebook-ads-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: [facebook.com, www.facebook.com]
    path: any
    required: true
  - tools: [apify--website-content-crawler, vdrmota--contact-info-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: public
    path: root
    required: true
# One entry per argument, so leaving any one out is blocked ("names no
# pinned value"), even where two arguments share a binding.
recipients:
  - tools: [compass--crawler-google-places]
    at: [maxCrawledPlacesPerSearch]
    bound: max_places_per_search
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequestsPerStartUrl]
    bound: max_pages_per_site
  - tools: [vdrmota--contact-info-scraper]
    at: [maxDepth]
    bound: max_crawl_depth
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequests]
    bound: max_pages_per_call
  - tools: [web_wanderer--google-reviews-scraper]
    at: [limit]
    bound: max_reviews
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdsPerSearch]
    bound: max_ads
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdvertisersPerQuery]
    bound: max_ad_advertisers
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [resultType]
    bound: ads_result_type
  - tools: [apify--facebook-ads-scraper]
    at: [resultsLimit]
    bound: max_ads
  - tools: [valig--indeed-jobs-scraper]
    at: [limit]
    bound: max_jobs
  - tools: [apify--website-content-crawler]
    at: [crawlerType]
    bound: site_crawler_type
  - tools: [apify--website-content-crawler]
    at: [htmlTransformer]
    bound: site_html_transformer
  - tools: [apify--website-content-crawler]
    at: [maxCrawlPages]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxResults]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxCrawlDepth]
    bound: max_site_depth
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [maxItems]
    bound: max_profile_results
# List lengths multiply the size pins: one search term per Maps call, at
# most 10 sites per contact call, one place per reviews call, one query
# per Google Ads call, one page URL per Facebook call, one start URL per
# site read, at most 10 handles per Instagram or TikTok read, at most 100
# items per dataset read. The lists are required, so leaving them out
# cannot skip the cap. The LinkedIn location list is optional (a search
# without one is no larger) and holds at most one city.
# only_keys names are compared exactly: send the spelling listed above.
limits:
  - tools: [compass--crawler-google-places]
    at: [searchStringsArray]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [vdrmota--contact-info-scraper]
    at: [startUrls]
    bound: max_sites_per_call
    kind: count
    required: true
  - tools: [web_wanderer--google-reviews-scraper]
    at: [place_ids]
    bound: max_review_places
    kind: count
    required: true
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [queries]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [startUrls]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--website-content-crawler]
    at: [startUrls]
    bound: max_site_urls
    kind: count
    required: true
  - tools: [apify--instagram-profile-scraper]
    at: [usernames]
    bound: max_profile_reads
    kind: count
    required: true
  - tools: [clockworks--tiktok-profile-scraper]
    at: [profiles]
    bound: max_profile_reads
    kind: count
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [locations]
    bound: max_profile_locations
    kind: count
  - tools: [get-dataset-items]
    at: [limit]
    bound: max_dataset_items
    kind: max
