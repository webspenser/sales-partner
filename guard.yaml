# sales-partner agent guard policy: applies to every MCP call inside an
# instance, whatever the server. Nothing this agent does sends, replies,
# forwards, publishes or schedules a message, or writes calendar events
# (which email invites); drafts go to the CRM or to Gmail drafts.
# call_tool: a generic dispatcher (Zernio) would hide any tool behind it.
# *_workflow*: n8n's instance-level tools run or rebuild any workflow, a
# dispatcher that could reach a workflow which sends.
covers: [no_send]
deny: ["*send*", "*reply*", "*forward*", "*publish*", "*schedule_message*",
       "*cross_post*", "*posts_create*", "*bulk_upload_posts*", "*posts_retry*",
       "*execute_write*", "*call_tool*", "*create_event*", "*update_event*",
       "*respond_to_event*", "*_workflow*", "*restore_workflow*"]
