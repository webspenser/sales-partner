# Airtable guard policy. The Airtable connector keys fields by ID, so every
# written key must be a field ID the probe recorded in bindings/crm.md
# (bound_keys_only); the rules below match those IDs by field name.
covers: [draft_only, dnc_one_way, no_delete]
allow: [list_bases, search_bases, list_tables_for_base, get_table_schema,
        list_records_for_table, search_records, create_records_for_table,
        update_records_for_table]
deny: ["*delete*"]
writes:
  - kind: create
    tools: [create_records_for_table]
    at: ["records[].fields"]
  - kind: update
    tools: [update_records_for_table]
    at: ["records[].fields"]
unknown_writes: block
bound_keys_only: true
rules:
  - field: Status
    create: [draft]
    update: [sent, voided]
  - field: Stage
    create: [New]
    update: [New, Scored, Researched, "Approach Drafted", Contacted, Replied, "Call Scheduled",
             "Call Held", "Following Up", Won, Lost, Disqualified]
  - field: Do Not Contact
    update: [true]
  - field: Draft Body
    forbid: update
