# Apify guard policy: ten actors and two reads, under the retrieval
# profile (Standard 7.5). Actors are allowed by name; any input not
# refused, pinned, capped or fixed passes, so a new optional vendor input
# no longer breaks a call. Everything else on the server (call-actor,
# search/add actors, store, tasks, webhooks, schedules, aborting runs,
# key-value stores) is outside allow. Names come from the probe notes:
# Maps and contacts from docs/superpowers/notes/2026-10-13-apify-connector-probe.md
# in agent-builder; reviews, ads, jobs and the site reader from this
# repo's docs/superpowers/notes/2026-10-18-research-actors-probe.md; the
# LinkedIn search and the Instagram and TikTok readers from
# docs/superpowers/notes/2026-11-03-social-profiles-actors-probe.md; the
# reviews swap from docs/superpowers/notes/2026-11-09-reviews-actor-probe.md;
# the LinkedIn email search mode from
# docs/superpowers/notes/2026-11-09-linkedin-email-search-probe.md. Tool
# names are matched without regard to case, and server_match apify covers
# any connector whose server name contains apify (claude_ai_Apify_Actors,
# claude_ai_Apify_Connector, Apify-Actors).
#
# How inputs are restricted:
# - refuse_args is one list for the whole policy: the code and
#   request-control keys no research call needs (page functions,
#   navigation hooks, headers, cookies, proxies, webhooks, and
#   requestsFromUrl and the request fields nested in a start URL).
# - A key that widens one actor's scope or cost, but that another actor
#   needs (startUrls, maxItems, resultsLimit, placeIds), is refused on
#   that actor alone with a fixed value of null and no required: the call
#   passes when the key is absent or null, and is blocked
#   ("must send <key> = null") otherwise. Each actor's list comes from its
#   probe.
# - Every size key is pinned (recipients) or capped (limits, required),
#   so leaving one out never falls back to a vendor default.
# - Text pins fix the Google Ads mode (resultType), the crawler
#   (crawlerType) and the HTML transformer (htmlTransformer).
# - Fixed values, each required: include_personal true on reviews and
#   profileScraperMode "Full + email search" on the LinkedIn search (the
#   operator's choice in 8.6.0: reviewer names and owners' emails help
#   outreach), onlyTotal true on Facebook, saveMarkdown true and
#   removeElementsCssSelector on the site reader, strictSearch true and
#   maxPages 1 on the LinkedIn search, resultsPerPage 1 on the TikTok
#   reader (its default is 100 videos per profile).
# - URL rules check every start URL: Facebook takes https pages on
#   facebook.com or www.facebook.com with no query or fragment; the site
#   reader and the contact scraper take only an https site root on a
#   public host (no path, query, fragment, IP address, local name or odd
#   port).
# Documented residual (Standard 7.5): a size key no probe found, or a cap
# key sent again under another spelling beside the real one, is not
# checked; the agent sends only the inputs usage.md names, and Apify's
# monthly usage limit is the backstop. The Instagram and TikTok readers
# take handles, not URLs: the guard counts them but cannot check what
# they say, so data could ride out in a handle, the same class of limit
# as data riding in a hostname. The web search and fetch tools
# (method GET, path /, options under query) carry the same class of
# residual: a search query or a fetch path can carry data out. Fetch
# URLs are https, public and paths only (no query or fragment), and the
# instructions refuse an email, phone number or CRM id in a path.
covers: [no_external_send, allowlisted_actors, pinned_inputs]
allow: [compass--crawler-google-places, vdrmota--contact-info-scraper, web_wanderer--google-reviews-scraper,
  scrapesage--google-ads-transparency-scraper, apify--facebook-ads-scraper, valig--indeed-jobs-scraper,
  apify--website-content-crawler, harvestapi--linkedin-profile-search-by-name, apify--instagram-profile-scraper,
  clockworks--tiktok-profile-scraper, apify--web-search, apify--web-fetch, scrapesage--bbb-scraper,
  delicious_zebu--yellowpages-usa-business-lead-scraper, web_wanderer--yelp-reviews-scraper,
  valig--linkedin-jobs-scraper, get-actor-run, get-dataset-items]
deny: ["*call-actor*", "*call_actor*", "*search-actors*", "*add-actor*", "*fetch-actor*", "*webhook*", "*schedule*"]
refuse_args: [pageFunction, preNavigationHooks, postNavigationHooks, customData, headers, customHttpHeaders,
  cookies, cookie, initialCookies, sessionCookies, sessionCookie, li_at, requestsFromUrl, "startUrls[].requestsFromUrl",
  "startUrls[].headers", "startUrls[].payload", "startUrls[].method", "startUrls[].userData", webhooks,
  proxyConfiguration, proxyConfig, proxy, proxyCountryCode, "query.headers", urlsFromFile]
# Apify's own run and dataset reads keep a key allowlist: their shapes are
# stable, and a dataset read must not take another export format.
only_keys:
  - tools: [get-dataset-items]
    at: ["$"]
    keys: [datasetId, fields, limit, offset, clean, omit, desc]
  - tools: [get-actor-run]
    at: ["$"]
    keys: [runId, waitSecs]
# Exact values, equal in type too (false is not "false"); leaving one out
# is blocked.
fixed:
  - tools: [web_wanderer--google-reviews-scraper]
    at: [include_personal]
    value: true
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [onlyTotal]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [saveMarkdown]
    value: true
    required: true
  - tools: [apify--website-content-crawler]
    at: [removeElementsCssSelector]
    value: 'script, style, noscript, svg'
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [profileScraperMode]
    value: 'Full + email search'
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [strictSearch]
    value: true
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [maxPages]
    value: 1
    required: true
  - tools: [clockworks--tiktok-profile-scraper]
    at: [resultsPerPage]
    value: 1
    required: true
  # The web search and fetch tools take an HTTP-shaped call; pinning GET
  # and / and refusing body keeps every checked value under query.
  - tools: [apify--web-search, apify--web-fetch]
    at: [method]
    value: 'GET'
    required: true
  - tools: [apify--web-search, apify--web-fetch]
    at: [path]
    value: '/'
    required: true
  - tools: [apify--web-search, apify--web-fetch]
    at: [body]
    value: null
  - tools: [scrapesage--bbb-scraper]
    at: [includeDetails]
    value: true
    required: true
  - tools: [delicious_zebu--yellowpages-usa-business-lead-scraper]
    at: [maxPages]
    value: 1
    required: true
  - tools: [scrapesage--bbb-scraper]
    at: [includeReviews, maxReviewsPerBusiness, enrichContacts, monitorMode, monitorKey, maxResultsPerSearch,
      maxConcurrency, startUrls, urlsFromFile]
    value: null
  - tools: [delicious_zebu--yellowpages-usa-business-lead-scraper]
    at: [urls]
    value: null
  - tools: [web_wanderer--yelp-reviews-scraper]
    at: [include_personal_data]
    value: true
    required: true
  - tools: [web_wanderer--yelp-reviews-scraper]
    at: [biz_ids, search_urls, search_location, search_limit, search_sort, search_features, search_price, domain,
      reviews_language, reviews_translate]
    value: null
  - tools: [valig--linkedin-jobs-scraper]
    at: [datePosted]
    value: 'r2592000'
    required: true
  - tools: [valig--linkedin-jobs-scraper]
    at: [urlParam, urlPath, keywords]
    value: null
  # Per-actor scope and cost keys, refused on that actor alone: null or
  # absent passes, any other value is blocked. Each list holds every paid
  # add-on and scope-widening input its probe note names (Maps and
  # contacts: agent-builder's 2026-10-13 probe), not only the ones the
  # agent might plausibly send.
  - tools: [compass--crawler-google-places]
    at: [locationQuery, startUrls, placeIds, customGeolocation, scrapeContacts, maxReviews, scrapePlaceDetailPage, website,
      maximumLeadsEnrichmentRecords, leadsEnrichmentDepartments, verifyLeadsEnrichmentEmails, maxImages, maxQuestions,
      enableCompetitorAnalysis, maxCompetitorsToAnalyze, includeWebResults, scrapeDirectories, scrapeOrderOnline,
      scrapeTableReservationProvider, scrapeSocialMediaProfiles, scrapeImageAuthors, scrapeReviewsPersonalData,
      reviewsFilterString, reviewsOrigin, reviewsSort, reviewsStartDate, categoryFilterWords, placeMinimumStars,
      searchMatching, skipClosedPlaces, allPlacesNoSearchAction]
    value: null
  - tools: [vdrmota--contact-info-scraper]
    at: [useBrowser, waitUntil, maximumLeadsEnrichmentRecords, leadsEnrichmentDepartments, verifyLeadsEnrichmentEmails,
      scrapeSocialMediaProfiles]
    value: null
  - tools: [web_wanderer--google-reviews-scraper]
    at: [place_urls, search, search_location, search_limit, search_coordination, sort_dataset, sort_keys]
    value: null
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [includeDetails, onlyNewAds, monitorStoreName, includeRawData, startUrls, urlsFromFile, domains, advertiserIds]
    value: null
  - tools: [apify--facebook-ads-scraper]
    at: [isDetailsPerAd, includeAboutPage, enrichWithEcommerceData, sorting, onlyAdsOlderThan]
    value: null
  - tools: [valig--indeed-jobs-scraper]
    at: [maxItems, startUrls]
    value: null
  - tools: [apify--website-content-crawler]
    at: [summarize, saveScreenshots, saveContentTypes, saveFiles, saveHtmlAsFile, includeUrlGlobs, useSitemaps, useLlmsTxt,
      clickElementsCssSelector, waitForSelector, maxConcurrency]
    value: null
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [currentCompanies, pastCompanies, schools, currentJobTitles, industryIds, profileUrls, searchQuery]
    value: null
  - tools: [apify--instagram-profile-scraper]
    at: [includeAboutSection, directUrls, resultsLimit, resultsType, searchType]
    value: null
  - tools: [clockworks--tiktok-profile-scraper]
    at: [commentsPerPost, topLevelCommentsPerPost, maxRepliesPerComment, maxFollowersPerProfile,
      maxFollowingPerProfile, shouldDownloadVideos, shouldDownloadCovers, shouldDownloadSlideshowImages,
      shouldDownloadAvatars, downloadSubtitlesOptions, oldestPostDateUnified, newestPostDate, leastDiggs, mostDiggs,
      profileSorting, excludePinnedPosts, profileScrapeSections, videoKvStoreIdOrName]
    value: null
# Every start URL must name a url that passes these rules (query and
# fragment are forbidden by default).
urls:
  - tools: [apify--facebook-ads-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: [facebook.com, www.facebook.com]
    path: any
    required: true
  - tools: [apify--website-content-crawler, vdrmota--contact-info-scraper]
    at: ["startUrls[].url"]
    schemes: [https]
    hosts: public
    path: root
    required: true
  - tools: [web_wanderer--yelp-reviews-scraper]
    at: ["biz_urls[]"]
    schemes: [https]
    hosts: [www.yelp.com]
    path: /biz
    required: true
  - tools: [apify--web-fetch]
    at: [query.url]
    schemes: [https]
    hosts: public
    path: any
    required: true
# One entry per argument, so leaving any one out is blocked ("names no
# pinned value"), even where two arguments share a binding.
recipients:
  - tools: [compass--crawler-google-places]
    at: [maxCrawledPlacesPerSearch]
    bound: max_places_per_search
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequestsPerStartUrl]
    bound: max_pages_per_site
  - tools: [vdrmota--contact-info-scraper]
    at: [maxDepth]
    bound: max_crawl_depth
  - tools: [vdrmota--contact-info-scraper]
    at: [maxRequests]
    bound: max_pages_per_call
  - tools: [web_wanderer--google-reviews-scraper]
    at: [limit]
    bound: max_reviews
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdsPerSearch]
    bound: max_ads
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [maxAdvertisersPerQuery]
    bound: max_ad_advertisers
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [resultType]
    bound: ads_result_type
  - tools: [apify--facebook-ads-scraper]
    at: [resultsLimit]
    bound: max_ads
  - tools: [valig--indeed-jobs-scraper]
    at: [limit]
    bound: max_jobs
  - tools: [apify--website-content-crawler]
    at: [crawlerType]
    bound: site_crawler_type
  - tools: [apify--website-content-crawler]
    at: [htmlTransformer]
    bound: site_html_transformer
  - tools: [apify--website-content-crawler]
    at: [maxCrawlPages]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxResults]
    bound: max_site_pages
  - tools: [apify--website-content-crawler]
    at: [maxCrawlDepth]
    bound: max_site_depth
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [maxItems]
    bound: max_profile_results
  - tools: [scrapesage--bbb-scraper]
    at: [maxResults]
    bound: max_bbb_results
  - tools: [web_wanderer--yelp-reviews-scraper]
    at: [reviews_limit]
    bound: max_reviews
  - tools: [valig--linkedin-jobs-scraper]
    at: [limit]
    bound: max_jobs
# List lengths multiply the size pins: one search term per Maps call, at
# most 10 sites per contact call, one place per reviews call, one query
# per Google Ads call, one page URL per Facebook call, one start URL per
# site read, at most 10 handles per Instagram or TikTok read, at most 100
# items per dataset read. The lists are required, so leaving them out
# cannot skip the cap. The LinkedIn location list is optional (a search
# without one is no larger) and holds at most one city.
# only_keys names are compared exactly: send the spelling listed above.
limits:
  - tools: [compass--crawler-google-places]
    at: [searchStringsArray]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [vdrmota--contact-info-scraper]
    at: [startUrls]
    bound: max_sites_per_call
    kind: count
    required: true
  - tools: [web_wanderer--google-reviews-scraper]
    at: [place_ids]
    bound: max_review_places
    kind: count
    required: true
  - tools: [scrapesage--google-ads-transparency-scraper]
    at: [queries]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--facebook-ads-scraper]
    at: [startUrls]
    bound: max_ad_queries
    kind: count
    required: true
  - tools: [apify--website-content-crawler]
    at: [startUrls]
    bound: max_site_urls
    kind: count
    required: true
  - tools: [apify--instagram-profile-scraper]
    at: [usernames]
    bound: max_profile_reads
    kind: count
    required: true
  - tools: [clockworks--tiktok-profile-scraper]
    at: [profiles]
    bound: max_profile_reads
    kind: count
    required: true
  - tools: [harvestapi--linkedin-profile-search-by-name]
    at: [locations]
    bound: max_profile_locations
    kind: count
  - tools: [scrapesage--bbb-scraper]
    at: [searchTerms, locations]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [web_wanderer--yelp-reviews-scraper]
    at: [biz_urls]
    bound: max_review_places
    kind: count
    required: true
  - tools: [valig--linkedin-jobs-scraper]
    at: [companyName]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [delicious_zebu--yellowpages-usa-business-lead-scraper]
    at: [searchKeyword]
    bound: max_search_terms
    kind: count
    required: true
  - tools: [apify--web-search]
    at: [query.maxResults]
    bound: max_web_results
    kind: max
    required: true
  - tools: [get-dataset-items]
    at: [limit]
    bound: max_dataset_items
    kind: max
